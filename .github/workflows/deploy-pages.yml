name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A Pages deployment left in progress blocks every later one with
      # "cancel <sha> first". The deploy action cannot raise its 10 minute cap.
      - name: Cancel a stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          import json, os, time, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          terminal = {"success", "failure", "error", "inactive", "cancelled", "deployment_cancelled"}

          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "learn-quran-pages",
              })
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode()
                  return json.loads(body) if body else {}

          deps = call("GET", f"https://api.github.com/repos/{repo}/pages/deployments?per_page=30")
          if isinstance(deps, dict):
              print(deps.get("message", deps))
              raise SystemExit(0)
          cancelled = False
          for dep in deps:
              status = dep.get("status")
              print(dep.get("id"), status, dep.get("sha", ""))
              if status in terminal:
                  continue
              print(f"Cancelling {dep['id']} ({status})")
              call("POST", f"https://api.github.com/repos/{repo}/pages/deployments/{dep['id']}/cancel")
              cancelled = True
          if cancelled:
              time.sleep(15)
          else:
              print("No stuck Pages deployment.")
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
