name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages names a deployment by its commit SHA. A deployment left in
      # progress blocks every later one until that SHA is cancelled.
      - name: Cancel a stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          import os, time, urllib.error, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          # Deploys after the last successful publish. Do not cancel 1e05d16.
          shas = [
              "f224a9ccbaaace38b87414dc643e4ae44c8ec8e6",
              "6cc619e266626009915ca2e220694d4d81b8f651",
              "9d04fa5ff1a3003420321131106d51059f405066",
              "b319295d6b45c87204b112dc5b72c15c81ad3d86",
              "63251682d408b015aad091dae85ec1b8cd493188",
              "a37ff842e29a1cbbcf51f1b1d4c4c7365f5bb1c0",
          ]

          def call(method, url):
              req = urllib.request.Request(url, data=b"" if method == "POST" else None, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "learn-quran-pages",
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read().decode()
                      print(method, resp.status, url.split("/")[-2:], body[:300])
                      return resp.status
              except urllib.error.HTTPError as err:
                  body = err.read().decode()
                  print(method, err.code, url.split("/")[-2:], body[:500])
                  return err.code

          cancelled = False
          for sha in shas:
              status = call("GET", f"https://api.github.com/repos/{repo}/pages/deployments/{sha}")
              if status == 404:
                  continue
              code = call("POST", f"https://api.github.com/repos/{repo}/pages/deployments/{sha}/cancel")
              if 200 <= code < 300:
                  cancelled = True
          if cancelled:
              time.sleep(15)
          else:
              print("No in-progress Pages deployment to cancel.")
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
